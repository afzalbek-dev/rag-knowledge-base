[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-base"
version = "1.0.0"
description = "Lightweight local Markdown knowledge base and TF-IDF semantic search engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Afzalbek", email = "afzalbek-dev@users.noreply.github.com"}]

[project.scripts]
rag-kb = "rag_kb.cli:main"
